name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  # The cheapest job, run first: it needs no compiler and catches the two
  # mistakes that cannot be undone once pushed to a public repository.
  guard-rails:
    name: Guard rails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No game assets in the repository
        run: python3 scripts/check_assets.py

      - name: Layering (real #include graph)
        run: python3 scripts/check_layers.py

      - name: The guard rails actually fire
        # A check that has never been observed to reject anything is not a
        # check. This plants each violation and asserts it is caught.
        run: bash scripts/test_enforcement.sh

      - name: ROADMAP and PROGRESS agree
        run: python3 scripts/check_progress.py

  # Layering lock #3, and the reason it is the only one that cannot be worked
  # around: this image has no Vulkan SDK, so a rendering include in the server
  # does not fail a policy check — it fails to compile.
  linux-server-only:
    name: Linux · headless server (no Vulkan SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Assert the image really has no Vulkan SDK
        # If a future runner image starts shipping Vulkan, this job would keep
        # passing while silently testing nothing at all.
        run: |
          if [ -f /usr/include/vulkan/vulkan.h ] || [ -n "${VULKAN_SDK:-}" ]; then
            echo "::error::A Vulkan SDK is present. This job's guarantee is void."
            exit 1
          fi
          echo "No Vulkan SDK present — the headless guarantee is meaningful."

      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}

      - run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" && ./scripts/bootstrap.sh
      - run: cmake --preset linux-server-only
      - run: cmake --build --preset linux-server-only
      - run: ctest --preset linux-server-only

      - name: The dedicated server links against no rendering library
        run: |
          BIN=build/linux-server-only/bin/ov_dedicated
          if ldd "$BIN" | grep -Ei 'vulkan|glfw|GL\.so|EGL'; then
            echo "::error::ov_dedicated links a rendering library."
            exit 1
          fi
          echo "ov_dedicated is clean."

      - name: It ticks at 20 Hz
        run: |
          START=$(date +%s%N)
          ./build/linux-server-only/bin/ov_dedicated --ticks=100
          ELAPSED_MS=$(( ($(date +%s%N) - START) / 1000000 ))
          echo "100 ticks in ${ELAPSED_MS} ms (expected ~5000)"
          if [ "$ELAPSED_MS" -lt 4500 ] || [ "$ELAPSED_MS" -gt 6500 ]; then
            echo "::error::Tick rate is off: ${ELAPSED_MS} ms for 100 ticks."
            exit 1
          fi

  macos:
    name: macOS · ${{ matrix.preset }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        preset: [macos-debug, macos-release]
    steps:
      - uses: actions/checkout@v4

      - run: brew install ninja ccache

      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-macos-${{ hashFiles('vcpkg.json') }}

      - run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" && ./scripts/bootstrap.sh
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  linux:
    name: Linux · ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        # A newer libstdc++ for the clang job, NOT libc++.
        #
        # The runner's clang 18 pairs with a libstdc++ that has no std::expected.
        # Switching our code to libc++ looks like the fix and is not: vcpkg builds
        # fmt with the default toolchain, so the link then mixes two standard
        # library ABIs and fails on std::string symbols. Installing g++-14 brings
        # a libstdc++ that clang picks up automatically, and everything stays on
        # one ABI.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y g++-14
            # Clang does not pick the newest libstdc++ on its own — the runner
            # has 12, 13 and 14 installed and it selected one without
            # std::expected. Naming it is the only reliable way.
            echo "CXXFLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14" >> "$GITHUB_ENV"
          fi

      - name: Report what the toolchain actually provides
        # Printed rather than guessed at. Which libstdc++ clang picks is not
        # obvious — installing a newer g++ does not by itself make clang use its
        # headers — and the configure check only says the feature is missing.
        run: |
          echo "── compiler ──"
          $CXX --version
          echo "── gcc installations visible to clang ──"
          $CXX -v -E -x c++ /dev/null 2>&1 | grep -iE "selected gcc|gcc install" || true
          ls -d /usr/include/c++/* 2>/dev/null || true
          echo "── does std::expected compile? ──"
          printf '#include <expected>\nint main(){ std::expected<int,int> e{1}; return *e - 1; }\n' > /tmp/probe.cpp
          echo "default:"
          $CXX -std=c++23 /tmp/probe.cpp -o /tmp/probe 2>&1 | head -5 || true
          for V in 14 13; do
            echo "with gcc $V:"
            $CXX -std=c++23 --gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/$V \
                 /tmp/probe.cpp -o /tmp/probe 2>&1 | head -5 || true
          done

      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-${{ matrix.compiler }}-${{ hashFiles('vcpkg.json') }}

      - run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" && ./scripts/bootstrap.sh
      - run: cmake --preset linux-debug
      - run: cmake --build --preset linux-debug
      - run: ctest --preset linux-debug

  windows:
    name: Windows · MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE
          git clone --depth 1 https://github.com/microsoft/vcpkg.git vcpkg
          .\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cmake --preset windows-debug
      - run: cmake --build --preset windows-debug
      - run: ctest --preset windows-debug

  sanitizers:
    name: Sanitizers · ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-14
          echo "CXXFLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-linux-clang-${{ hashFiles('vcpkg.json') }}
      - run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE" && ./scripts/bootstrap.sh
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset linux-debug -DOV_SANITIZER=${{ matrix.sanitizer }}
      - run: cmake --build --preset linux-debug
      - run: ctest --preset linux-debug

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned clang-format
        # Pinned, not whatever the runner ships. clang-format changes its output
        # between releases, so an unpinned one turns this gate into noise that
        # fails on version skew rather than on anything a contributor did.
        # The same version is installed locally by scripts/bootstrap.sh.
        run: |
          VERSION=$(cat .clang-format-version)
          echo "Using clang-format $VERSION"
          pipx install "clang-format==$VERSION"

      - name: Check formatting
        run: |
          find src apps tools -type f \( -name '*.cpp' -o -name '*.hpp' \) 2>/dev/null \
            | xargs -r clang-format --dry-run --Werror
